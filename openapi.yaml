        '200':
          description: successful
          content:
            application/json:
              example:
                file_url: https://www.signwell.com/completed_docs/5pZeLDQAnbfGl8NNpRkntARP6bRZ/nom151_certificate/
              schema:
                "$ref": "#/components/schemas/Nom151UrlResponse"
        '404':
          description: not_found
          content:
            application/json:
              example:
                message: Not found
                meta:
                  error: record_not_found
                  message: Couldn't find the document requested
                  messages:
                  - Couldn't find the document requested
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: unprocessable_entity
          content:
            application/json:
              example:
                errors:
                  table:
                    not_available: NOM-151 certificate not available
              schema:
                "$ref": "#/components/schemas/ValidationErrorResponse"
        '429':
          description: rate limit exceeded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RateLimitErrorResponse"
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-Api-Key
      in: header
  schemas:
    FieldType:
      type: string
      enum:
      - initials
      - signature
      - checkbox
      - date
      - select
      - text
      - dropdown
      - autofill_company
      - autofill_email
      - autofill_first_name
      - autofill_last_name
      - autofill_name
      - autofill_phone
      - autofill_title
      - autofill_date_signed
      description: Type of signing field
    TextValidation:
      type: string
      enum:
      - no_text_validation
      - numbers
      - letters
      - email_address
      - us_phone_number
      - us_zip_code
      - us_ssn
      - us_age
      - alphanumeric
      - us_bank_routing_number
      - us_bank_account_number
      - custom
      description: Validation rule for text fields
    ValidationRegex:
      type: string
      description: 'Text fields with custom validation only: the regex pattern used
        to validate field values. Required when validation is set to custom.'
    ValidationRegexErrorMessage:
      type: string
      description: 'Text fields with custom validation only: the error message shown
        to the recipient when their input doesn''t match the regex pattern. Required
        when validation is set to custom.'
    DateFormat:
      type: string
      enum:
      - MM/DD/YYYY
      - DD/MM/YYYY
      - YYYY/MM/DD
      - Month DD, YYYY
      - MM/DD/YYYY hh:mm:ss a
      description: 'Date format for date fields. Valid values: MM/DD/YYYY, DD/MM/YYYY,
        YYYY/MM/DD, Month DD, YYYY, MM/DD/YYYY hh:mm:ss a. Default: MM/DD/YYYY'
    CheckboxValidation:
      type: string
      enum:
      - minimum
      - maximum
      - range
      - exact
      description: Validation rule for checkbox groups
    FileInfo:
      type: object
      description: File information
      properties:
        name:
          type: string
          description: File name
          nullable: true
        pages_number:
          type: integer
          description: Number of pages in the file
      required:
      - pages_number
    LabelInfo:
      type: object
      description: Label information
      properties:
        id:
          type: string
          description: Label ID
        name:
          type: string
          description: Label name
    CopiedContactInfo:
      type: object
      description: Copied contact information
      properties:
        id:
          type: string
          description: Contact ID
        name:
          type: string
          description: Contact name
        email:
          type: string
          format: email
          description: Contact email
      required:
      - email
    CheckboxGroupInfo:
      type: object
      description: Checkbox group configuration
      properties:
        id:
          type: string
          format: uuid
          description: Checkbox group ID
        group_name:
          type: string
          nullable: true
          description: Name of the checkbox group
        recipient_id:
          type: string
          nullable: true
          description: Recipient ID associated with the group
        checkbox_ids:
          type: array
          items:
            type: string
          description: IDs of checkboxes in this group
        validation:
          "$ref": "#/components/schemas/CheckboxValidation"
          nullable: true
        required:
          type: boolean
          description: Whether at least one checkbox must be checked
        min_value:
          type: integer
          description: Minimum number of checkboxes to check
        max_value:
          type: integer
          description: Maximum number of checkboxes to check
        exact_value:
          type: integer
          description: Exact number of checkboxes that must be checked
      required:
      - id
      - checkbox_ids
      - required
    AttachmentRequestInfo:
      type: object
      description: Attachment request information
      properties:
        name:
          type: string
          description: Name of the attachment request
        url:
          type: string
          format: url
          description: URL of the uploaded attachment (when available)
        required:
          type: boolean
          description: Whether the attachment is required
      required:
      - name
      - required
    ConditionalRuleRequest:
      type: object
      description: 'A conditional logic rule. Create requires target_id, action_type,
        action_field_ids and conditions; id and deleted are ignored on create. On
        an update (template update or document update-and-send) the rules are an incremental
        upsert keyed by id: send id + the fields to change to modify a rule, id +
        deleted: true to remove it, or omit id to add a new rule.'
      properties:
        id:
          type: string
          description: 'The rule''s persistent ID. Ignored on create (every rule is
            new). On an update (template update or document update-and-send) include
            it to modify an existing rule, or pair it with `deleted: true` to remove
            the rule; omit it to add a new rule.'
        deleted:
          type: boolean
          description: 'Only meaningful on an update (template update or document
            update-and-send): set to true together with the rule''s `id` to remove
            that rule. Ignored on create — there is no existing rule to delete.'
        target_id:
          type: string
          description: api_id of the field that owns the rule, or the external_id
            of a checkbox group when the rule is owned by a group (groups have no
            api_id). Cannot also appear in action_field_ids (self-reference is forbidden).
        action_type:
          type: string
          enum:
          - show
          - hide
          - require
          description: 'Action applied to action_field_ids when the conditions are
            met: `show`, `hide`, or `require`.'
        action_field_ids:
          type: array
          items:
            type: string
          description: api_ids of the fields the action applies to. List a checkbox
            group's member api_ids to target the whole group.
        conditions:
          type: array
          description: The conditions that trigger the rule. At least 1, at most 5.
          items:
            type: object
            properties:
              condition_type:
                type: string
                enum:
                - any_of
                - all_of
                - none_of
                - not_all_of
                description: 'How the field_api_ids combine within a condition: `any_of`,
                  `all_of`, `none_of`, or `not_all_of`.'
              status:
                type: string
                enum:
                - completed
                - not_completed
                description: 'The field state the condition tests for: `completed`
                  or `not_completed`.'
              join_operator:
                type: string
                enum:
                - and_operator
                - or_operator
                description: 'How this condition joins the next one in the rule: `and_operator`
                  or `or_operator`. The first condition''s value is ignored.'
              field_api_ids:
                type: array
                items:
                  type: string
                description: api_ids of the trigger fields the condition watches.
              position:
                type: integer
                description: 1-indexed order of the condition within the rule.
            required:
            - condition_type
            - status
            - field_api_ids
    ConditionalRuleInfo:
      type: object
      description: Conditional rule configuration
      properties:
        id:
          type: string
          description: Conditional rule ID
        target_id:
          type: string
          description: api_id of the field that owns the rule, or the external_id
            of a checkbox group when the rule is owned by a group (groups have no
            api_id)
        action_type:
          type: string
          enum:
          - show
          - hide
          - require
          description: Action applied to action_field_ids when the conditions are
            met
        action_field_ids:
          type: array
          items:
            type: string
          description: api_ids of fields the rule affects when triggered
        conditions:
          type: array
          items:
            type: object
            properties:
              condition_type:
                type: string
                enum:
                - any_of
                - all_of
                - none_of
                - not_all_of
                description: How field_api_ids combine within this condition
              status:
                type: string
                enum:
                - completed
                - not_completed
                description: Field state that satisfies this condition
              join_operator:
                type: string
                enum:
                - and_operator
                - or_operator
                description: How this condition joins with the next one in the rule
              field_api_ids:
                type: array
                items:
                  type: string
                description: api_ids of fields evaluated by this condition
              position:
                type: integer
                description: Order of this condition within the rule
      required:
      - id
      - target_id
      - action_type
    ConditionalLogicDecisionInfo:
      type: object
      description: Audit record of a signer-side decision about a CL rule that fired
        against a completed field.
      properties:
        rule_id:
          type: string
          description: External ID of the conditional rule that fired
        field_api_id:
          type: string
          description: api_id of the field the decision applies to
        decision_type:
          type: string
          enum:
          - kept_signature
          - cleared_value
          description: Whether the signer kept the existing signature or the value
            was cleared
        decided_at:
          type: string
          format: date-time
          description: When the decision was recorded
        description:
          type: string
          description: Human-readable summary of the decision
      required:
      - rule_id
      - field_api_id
      - decision_type
      - decided_at
    AdditionalFields:
      type: array
      description: Fields to be added to any appended files (not existing files).
        Document fields placed on a document for collecting data or signatures from
        recipients. Field data should be sent as a 2-dimensional JSON array. One array
        of fields is needed for each file in the files array. An array of fields can
        be empty if you have a file that does not contain any fields.
      items:
        type: array
        description: Array of Fields you're adding to each file.
        items:
          type: object
          properties:
            x:
              type: number
              format: float
              description: Horizontal value in the coordinates of the field (in pixels).
                Coordinates are specific to the page where fields are located.
            "y":
              type: number
              format: float
              description: Vertical value in the coordinates of the field (in pixels).
                Coordinates are specific to the page where fields are located.
            page:
              type: integer
              description: The page number within the file. If the page does not exist
                within the file then the field won't be created.
            recipient_id:
              type: string
              description: Unique identifier of the recipient assigned to the field.
                Recipients assigned to fields will be the only ones that will see
                and be able to complete those fields.
            type:
              "$ref": "#/components/schemas/FieldType"
              description: 'Field type of the field. Valid field types: initials,
                signatures, checkbox, date, and text. To autofill fields with contact
                data, use an autofill field type. To group checkbox fields, enter
                an api_id for each checkbox and add the checkbox_groups parameter.'
            required:
              type: boolean
              default: true
              description: Whether the field must be completed by the recipient. Defaults
                to `true` except for checkbox type fields.
            label:
              type: string
              description: 'Text and Date fields only: label that is displayed when
                the field is empty.'
            value:
              oneOf:
              - type: string
              - type: boolean
              - type: number
              description: Varies according to the field type. Text fields accept
                strings or numbers. Date fields accept Iso8601 date strings. CheckBoxes
                accept booleans. Signature and Initials fields can't be signed through
                API requests. Autofill text fields accept strings or numbers.
            api_id:
              type: string
              description: Unique identifier of the field. Useful when needing to
                reference specific field values or update a document and its fields.
            name:
              type: string
              description: Checkbox fields only. At least 2 checkbox fields in an
                array of fields must be assigned to the same recipient and grouped
                with selection requirements.
            validation:
              "$ref": "#/components/schemas/TextValidation"
              description: 'Text fields only: optional validation for field values.
                Valid values: numbers, letters, email_address, us_phone_number, us_zip_code,
                us_ssn, us_age, alphanumeric, us_bank_routing_number, us_bank_account_number,
                custom. To set custom validation, enter a regex pattern and regex
                error message.'
            validation_regex:
              "$ref": "#/components/schemas/ValidationRegex"
            validation_regex_error_message:
              "$ref": "#/components/schemas/ValidationRegexErrorMessage"
            fixed_width:
              type: boolean
              default: false
              description: 'Text fields only: whether the field width will stay fixed
                and text will display in multiple lines, rather than one long line.
                If set to `false` the field width will automatically grow horizontally
                to fit text on one line. Defaults to `false`.'
            lock_sign_date:
              type: boolean
              default: false
              description: 'Date fields only: makes fields readonly and automatically
                populates with the date the recipient signed. Defaults to `false`.'
            date_format:
              "$ref": "#/components/schemas/DateFormat"
              description: 'Date fields only: date format to use for the field. Valid
                values: MM/DD/YYYY, DD/MM/YYYY, YYYY/MM/DD, Month DD, YYYY, and MM/DD/YYYY
                hh:mm:ss a. Defaults to MM/DD/YYYY.'
            formula:
              type: string
              description: 'Date fields only (text field formulas coming soon): formulas
                are a way to prefill fields with calculated future or past dates.
                Addition, subtraction, and parentheses are allowed. Valid event dates
                are `created_date`, `sent_date`, and `signed_date`. Valid time periods
                are `day`, `days`, `week`, `weeks`, `month`, and `months`. Example:
                `formula: ''sent_date + 10 days''`. Use with `lock_sign_date` if you''d
                like to make the field readonly and prevent signers from choosing
                a different date.'
            height:
              type: number
              format: float
              description: 'Height of the field (in pixels). Maximum height varies
                by field type: Signature/Initials (200px), others (74px). When using
                text tags if the height is greater than the maximum height, the height
                will be set to the maximum height.'
            width:
              type: number
              format: float
              description: Width of the field (in pixels). For text fields, width
                will auto-grow unless `fixed_width` is true.
            options:
              type: array
              description: Array of dropdown options (for dropdown/select fields only)
              items:
                "$ref": "#/components/schemas/DropdownOption"
            default_option:
              type: string
              description: Default selected option (for dropdown/select fields only)
            allow_other:
              type: boolean
              description: Whether to allow "Other" option with text input (for dropdown/select
                fields only)
              default: false
          required:
          - x
          - "y"
          - page
          - recipient_id
          - type
    AdditionalFiles:
      type: array
      items:
        type: object
        description: 'Additional files to be appended to the document. Will not replace
          existing files from the template. Document files can be uploaded by specifying
          a file URL or base64 string. Either `file_url` or `file_base64` must be
          present (not both). Valid file types are: .pdf, .docx, .jpg, .png, .ppt,
          .xls, .pages, and .txt.'
        properties:
          name:
            type: string
            description: Name of the file that will be uploaded.
          file_url:
            type: string
            format: url
            description: Publicly available URL of the file to be uploaded.
          file_base64:
            type: string
            format: byte
            description: A RFC 4648 base64 string of the file to be uploaded.
        required:
        - name
    ApiApplicationId:
      type: string
      format: uuid
      description: Unique identifier for API Application settings to use. API Applications
        are optional and mainly used when isolating OAuth apps or for more control
        over embedded API settings
    TemplateAttachmentRequests:
      type: array
      description: Attachments that a recipient must upload to complete the signing
        process. Attachment requests are shown after all document fields have been
        completed.
      items:
        type: object
        properties:
          name:
            type: string
            description: Name of the requested attachment.
          placeholder_id:
            type: string
            description: Unique identifier of the recipient that will view the attachment
              request.
          required:
            type: boolean
            default: true
            description: Whether the recipient will need to upload the attachment
              to successfully complete/sign the document. Defaults to `true`.
        required:
        - name
        - placeholder_id
    AttachmentRequests:
      type: array
      description: Attachments that a recipient must upload to complete the signing
        process. Attachment requests are shown after all document fields have been
        completed.
      items:
        type: object
        properties:
          name:
            type: string
            description: Name of the requested attachment.
          recipient_id:
            type: string
            description: Unique identifier of the recipient that will view the attachment
              request.
          required:
            type: boolean
            default: true
            description: Whether the recipient will need to upload the attachment
              to successfully complete/sign the document. Defaults to `true`.
        required:
        - name
        - recipient_id
    TemplateCheckboxGroups:
      type: array
      description: Checkbox fields that are placed on a document can be grouped with
        selection requirements. At least 2 checkbox fields in an array of fields must
        be assigned to the same recipient.
      items:
        type: object
        properties:
          group_name:
            type: string
            description: A unique identifier for the checkbox group.
          placeholder_id:
            type: string
            description: The recipient ID associated with the checkbox group.
          checkbox_ids:
            type: array
            items:
              type: string
              description: A unique identifier for each checkbox in a group. ID must
                match the api_id of the checkbox field.
          validation:
            "$ref": "#/components/schemas/CheckboxValidation"
            description: 'Set requirements for the group of one or multiple selections
              by the recipient. Defaults to minimum. Validation values: minimum, maximum,
              exact, range.'
          required:
            type: boolean
            default: false
            description: Whether the group must be completed by the recipient. Defaults
              to false.
          min_value:
            type: integer
            description: 'The minimum number of checkboxes that must be checked in
              the group. (Only for validation: minimum and range)'
          max_value:
            type: integer
            description: 'The maximum number of checkboxes that can be checked in
              the group. (Only for validation: maximum and range)'
          exact_value:
            type: integer
            description: 'The exact number of checkboxes that must be checked in the
              group. (Only for validation: exact)'
        required:
        - group_name
        - placeholder_id
        - checkbox_ids
    CheckboxGroups:
      type: array
      description: Checkbox fields that are placed on a document can be grouped with
        selection requirements. At least 2 checkbox fields in an array of fields must
        be assigned to the same recipient.
      items:
        type: object
        properties:
          group_name:
            type: string
            description: A unique identifier for the checkbox group.
          recipient_id:
            type: string
            description: The recipient ID associated with the checkbox group.
          checkbox_ids:
            type: array
            items:
              type: string
              description: A unique identifier for each checkbox in a group. ID must
                match the api_id of the checkbox field.
          validation:
            "$ref": "#/components/schemas/CheckboxValidation"
            description: 'Set requirements for the group of one or multiple selections
              by the recipient. Defaults to minimum. Validation values: minimum, maximum,
              exact, range.'
          required:
            type: boolean
            default: false
            description: Whether the group must be completed by the recipient. Defaults
              to false.
          min_value:
            type: integer
            description: 'The minimum number of checkboxes that must be checked in
              the group. (Only for validation: minimum and range)'
          max_value:
            type: integer
            description: 'The maximum number of checkboxes that can be checked in
              the group. (Only for validation: maximum and range)'
          exact_value:
            type: integer
            description: 'The exact number of checkboxes that must be checked in the
              group. (Only for validation: exact)'
        required:
        - group_name
        - recipient_id
        - checkbox_ids
    BulkSendCsv:
      type: string
      description: 'A RFC 4648 base64 string of the template CSV file to be validated.
        While 21 CFR Part 11 is enabled, every recipient needs a name: the CSV must
        carry a name column next to each placeholder email column (for example `signer_name`
        alongside `signer_email`), and each row must fill that name in wherever it
        carries the matching email, otherwise it returns a 422. A row that leaves
        both the email and the name blank sends nothing to that placeholder, so no
        name is needed there.'
    Base64Flag:
      type: boolean
      description: When true, returns the CSV as a base64-encoded string in a JSON
        response instead of a binary file download.
    BulkSendCsvTemplateResponse:
      type: object
      description: Base64-encoded CSV template
      properties:
        data:
          type: string
          format: byte
          description: Base64-encoded CSV content
      required:
      - data
    BulkSendId:
      type: string
      format: uuid
      description: Unique identifier for a bulk send.
    BulkSendTemplateIds:
      type: array
      description: Specify one or more templates to generate a single blank CSV file
        that will contain available columns for your recipient data. The template_ids[]
        parameter is an array of template IDs (e.g.,`/?template_ids[]=5a67dbd7-928a-4ea0-a7e2-e476a0eb045f&template_ids[]=d7315111-c671-4b15-8354-c9a19bbaefa0`).
        Each ID should be a separate parameter in the query string.
      items:
        type: string
        format: uuid
    CopiedContacts:
      type: array
      description: Copied contacts are emailed the final document once it has been
        completed by all recipients.
      items:
        type: object
        properties:
          name:
            type: string
            description: Name of the copied contact.
          email:
            type: string
            format: email
            description: Email for the copied contact.
        required:
        - email
    CopiedPlaceholders:
      type: array
      description: Copied placeholders are emailed the final document once it has
        been completed by all recipients.
      items:
        type: object
        properties:
          name:
            type: string
            description: Name of the placeholder.
          preassigned_recipient_name:
            type: string
            description: In some cases, it may be necessary to pre-fill the name and
              email for a placeholder because it will always be the same person for
              all documents created from this template. This sets the name. Every
              recipient on a 21 CFR Part 11 document needs a name, so leaving it unset
              means the name has to be supplied when the document is created.
          preassigned_recipient_email:
            type: string
            format: email
            description: In some cases, it may be necessary to pre-fill the name and
              email for a placeholder because it will always be the same person for
              all documents created from this template. This sets the email.
        required:
        - name
    CompletedDocumentId:
      type: string
      format: uuid
      description: Unique identifier for a completed document.
    DocumentId:
      type: string
      format: uuid
      description: Unique identifier for a document.
    Recipients:
      type: array
      description: Document recipients are people that must complete and/or sign a
        document.
      items:
        type: object
        properties:
          id:
            type: string
            description: A unique identifier that you will give to each recipient.
              We recommend numbering sequentially from 1 to X. IDs are required for
              associating recipients to fields and more.
          name:
            type: string
            description: 'Name of the recipient. Required on 21 CFR Part 11 documents:
              a recipient without a name returns a 422.'
          email:
            type: string
            format: email
            description: Email address for the recipient. Required unless the recipient's
              `delivery_method` is `sms`.
            example: signer@example.com
          passcode:
            type: string
            description: If set, signers assigned with a passcode will be required
              to enter the passcode before they’re able to view and complete the document.
              On a 21 CFR Part 11 document SignWell generates the passcode, so a sender-defined
              passcode returns a 422.
          passcode_delivery:
            type: object
            description: Passcode delivery settings. When enabled, the system delivers
              the passcode to the signer via email. Always on for 21 CFR Part 11 documents
              and cannot be disabled.
            properties:
              enabled:
                type: boolean
                description: 'Enable passcode delivery for this recipient. Cannot
                  be set to `false` on a 21 CFR Part 11 document: it returns a 422.'
              methods:
                type: array
                items:
                  type: string
                  enum:
                  - email
                description: 'Delivery methods for the passcode. Currently supports:
                  email. Defaults to ["email"] when omitted.'
              expire_after_access:
                type: boolean
                description: When enabled, the passcode is cleared after successful
                  authentication. If passcode_delivery is also enabled, a new passcode
                  is auto-generated on the next send request. Otherwise the recipient
                  will no longer need a passcode.
          subject:
            type: string
            description: Email subject for the signature request that the recipient
              will see. Overrides the general subject for the document.
          message:
            type: string
            description: Email message for the signature request that the recipient
              will see. Overrides the general message for the document.
          send_email:
            type: boolean
            default: false
            description: Applies on when `embedded_signing` is `true`. By default,
              recipients are not notified through email to sign when doing embedded
              signing. Setting this to `true`  will send a notification email to the
              recipient. Default is `false`.
          send_email_delay:
            type: integer
            default: 0
            description: If `send_email` is `true` recipients will receive a new document
              notification immediately. In the case of embedded signing, you can delay
              this notification to only send if the document is not completed within
              a few minutes. The email notification will not go out if the document
              is completed before the delay time is over. Valid values are in minutes
              ranging from `0` to `60`. Defaults to `0`.
          delivery_method:
            type: string
            enum:
            - email
            - sms
            - email_and_sms
            default: email
            description: 'How the recipient is notified and receives the signing link:
              `email` (default), `sms`, or `email_and_sms`. SMS delivery is available
              only to workspaces that are eligible for SMS and have it enabled. `email`
              requires `email`, `sms` requires `phone_number`, and `email_and_sms`
              requires both. SMS content always uses fixed system templates; `subject`
              and `message` apply to email notifications only. A 21 CFR Part 11 document
              records one verified channel per recipient: `email` and `sms` are both
              accepted, while `email_and_sms` returns a 422.'
          phone_number:
            type: string
            example: "+14155551234"
            description: Recipient phone number in E.164 format (for example `+14155551234`).
              Required when `delivery_method` is `sms` or `email_and_sms`. Only phone
              numbers from the country codes currently enabled for SMS are accepted.
          send_sms:
            type: boolean
            default: false
            description: Applies only when `embedded_signing` is `true` and the recipient's
              `delivery_method` includes SMS. By default, recipients are not notified
              through SMS when doing embedded signing. Setting this to `true` will
              send the SMS notification to the recipient. Default is `false`.
          send_sms_delay:
            type: integer
            default: 0
            description: If `send_sms` is `true` the recipient will receive the SMS
              notification immediately. In the case of embedded signing, you can delay
              this notification to only send if the document is not completed within
              a few minutes. The SMS will not go out if the document is completed
              before the delay time is over. Valid values are in minutes ranging from
              `0` to `60`. Defaults to `0`.
        required:
        - id
    Fields:
      type: array
      description: Document fields placed on a document for collecting data or signatures
        from recipients. At least one field must be present in the Create Document
        request if `draft` is `false` (unless adding a signature page by using `with_signature_page`).
        Field data should be sent as a 2-dimensional JSON array. One array of fields
        is needed for each file in the files array. An array of fields can be empty
        if you have a file that does not contain any fields.
      items:
        type: array
        description: Array of Fields you're adding to each file.
        items:
          type: object
          properties:
            x:
              type: number
              format: float
              description: Horizontal value in the coordinates of the field (in pixels).
                Coordinates are specific to the page where fields are located.
            "y":
              type: number
              format: float
              description: Vertical value in the coordinates of the field (in pixels).
                Coordinates are specific to the page where fields are located.
            page:
              type: integer
              description: The page number within the file. If the page does not exist
                within the file then the field won't be created.
            recipient_id:
              type: string
              description: Unique identifier of the recipient assigned to the field.
                Recipients assigned to fields will be the only ones that will see
                and be able to complete those fields.
            type:
              "$ref": "#/components/schemas/FieldType"
              description: 'Field type of the field. Valid field types: initials,
                signatures, checkbox, date, and text. To autofill fields with contact
                data, use an autofill field type. To group checkbox fields, enter
                an api_id for each checkbox and add the checkbox_groups parameter.'
            required:
              type: boolean
              default: true
              description: Whether the field must be completed by the recipient. Defaults
                to `true` except for checkbox type fields.
            label:
              type: string
              description: 'Text and Date fields only: label that is displayed when
                the field is empty.'
            value:
              oneOf:
              - type: string
              - type: boolean
              - type: number
              description: Varies according to the field type. Text fields accept
                strings or numbers. Date fields accept Iso8601 date strings. CheckBoxes
                accept booleans. Signature and Initials fields can't be signed through
                API requests. Autofill text fields accept strings or numbers.
            api_id:
              type: string
              description: Unique identifier of the field. Useful when needing to
                reference specific field values or update a document and its fields.
            name:
              type: string
              description: Checkbox fields only. At least 2 checkbox fields in an
                array of fields must be assigned to the same recipient and grouped
                with selection requirements.
            validation:
              "$ref": "#/components/schemas/TextValidation"
              description: 'Text fields only: optional validation for field values.
                Valid values: numbers, letters, email_address, us_phone_number, us_zip_code,
                us_ssn, us_age, alphanumeric, us_bank_routing_number, us_bank_account_number,
                custom. To set custom validation, enter a regex pattern and regex
                error message.'
            validation_regex:
              "$ref": "#/components/schemas/ValidationRegex"
            validation_regex_error_message:
              "$ref": "#/components/schemas/ValidationRegexErrorMessage"
            fixed_width:
              type: boolean
              default: false
              description: 'Text fields only: whether the field width will stay fixed
                and text will display in multiple lines, rather than one long line.
                If set to `false` the field width will automatically grow horizontally
                to fit text on one line. Defaults to `false`.'
            lock_sign_date:
              type: boolean
              default: false
              description: 'Date fields only: makes fields readonly and automatically
                populates with the date the recipient signed. Defaults to `false`.'
            date_format:
              "$ref": "#/components/schemas/DateFormat"
              description: 'Date fields only: date format to use for the field. Valid
                values: MM/DD/YYYY, DD/MM/YYYY, YYYY/MM/DD, Month DD, YYYY, and MM/DD/YYYY
                hh:mm:ss a. Defaults to MM/DD/YYYY.'
            height:
              type: number
              format: float
              description: 'Height of the field (in pixels). Maximum height varies
                by field type: Signature/Initials (200px), others (74px). When using
                text tags if the height is greater than the maximum height, the height
                will be set to the maximum height.'
            width:
              type: number
              format: float
              description: Width of the field (in pixels). For text fields, width
                will auto-grow unless `fixed_width` is true.
            options:
              type: array
              description: Array of dropdown options (for dropdown/select fields only)
              items:
                "$ref": "#/components/schemas/DropdownOption"
            default_option:
              type: string
              description: Default selected option (for dropdown/select fields only)
            allow_other:
              type: boolean
              description: Whether to allow "Other" option with text input (for dropdown/select
                fields only)
              default: false
          required:
          - x
          - "y"
          - page
          - recipient_id
          - type
    TemplateFields:
      type: array
      description: Document fields placed on a document for collecting data or signatures
