              description: Write-only. Reports only that a logo was set, never its
                URL or Base64 payload.
            accent_color:
              type: string
              description: 'Hex, as #RRGGBB.'
            button_label_color:
              type: string
              description: 'Hex, as #RRGGBB.'
            link_color:
