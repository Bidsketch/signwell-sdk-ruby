    EmbeddedBrandingRequest:
      type: object
      nullable: true
      description: 'Branding for this document''s embedded requesting and signing
        experiences. Every property is optional and independent. A property you supply
        overrides the selected API Application; one you omit inherits from it, then
        from the SignWell default. `company_logo` has one extra step between those
        two: the account''s Settings > Branding logo, which applies on paid plans
        only. The colors and the border radius have no account step — omitting one
        falls straight through to the SignWell default. On Update and Send Document
        the object is a patch: only the properties you send change, and a property
        sent as `null` clears your override so the value inherits again. Sending `branding`
        itself as `null` clears every property.'
      properties:
        company_logo:
          type: object
          nullable: true
          description: Logo shown on this document's embedded pages. Supply either
            `file_url` or `file_base64`, never both — sending both returns a `422`.
            Sending `company_logo` replaces the logo outright, so whichever source
            you omit is cleared; sending it as `null` removes the logo. Recommended
            size is 300 x 60 px with a transparent background; these are recommendations,
            not validated. In responses this property is `"provided"` — the URL and
            the Base64 payload are never returned.
          properties:
            file_url:
              type: string
              description: Public `http` or `https` URL of the logo image. The value
                has to parse as one — anything else returns a `422`. SignWell never
                requests the URL when the document is created, so it is not checked
                for reachability or for what it points at. If the URL turns out to
                be unreachable, slow, or not a usable image when the page loads, the
                page falls back to the no-logo experience rather than erroring.
              example: https://example.com/customer-logo.png
            file_base64:
              type: string
              description: RFC 4648 Base64 string of the logo image. The 300 KB limit
                applies to the decoded image, not to the string you send, so a valid
                string runs about a third larger. The decoded image must be one of
                image/jpeg, image/png, image/gif, image/tiff, image/webp, image/svg+xml,
                image/heic, image/heif, image/avif. A payload that cannot be decoded,
                is not one of those formats, or is over the size limit returns a `422`.
                A payload that is accepted here but still fails to render when the
                page loads falls back to the no-logo experience.
        accent_color:
          type: string
          nullable: true
          description: Accent color for this document's embedded pages, as a 6-digit
            HEX value. Returned normalized to `#RRGGBB`.
          example: "#51B6C4"
        button_label_color:
          type: string
          nullable: true
          description: Button label color for this document's embedded pages, as a
            6-digit HEX value. Returned normalized to `#RRGGBB`.
          example: "#FFFFFF"
        link_color:
          type: string
          nullable: true
          description: Link color for this document's embedded pages, as a 6-digit
            HEX value. Returned normalized to `#RRGGBB`.
          example: "#1A0DAB"
        button_border_radius:
          type: integer
          nullable: true
          minimum: 0
          maximum: 25
          description: Corner radius of buttons on this document's embedded pages,
            in pixels. Must be between 0 and 25.
          example: 25
    EmbeddedRequest:
      type: object
      description: 'Optional container for embedded settings. Purely additive: requests
        that omit it behave exactly as before, and the existing top-level `api_application_id`,
        `embedded_signing` and `embedded_signing_notifications` parameters are unchanged.
        Not supported on template endpoints, which return a `422` if it is present.'
      properties:
        branding:
          "$ref": "#/components/schemas/EmbeddedBrandingRequest"
    EmbeddedBranding:
      type: object
      nullable: true
      description: 'The branding the caller set on THIS document, echoed back. Null
        when the caller set none: the document then renders with the API Application,
        workspace or system branding, and that resolved branding is deliberately not
        reported here.'
      properties:
        branding:
          type: object
          description: 'Only the properties actually set on the document. Every one
            is optional: an unset property is absent rather than null, because null
            is how a request clears one.'
          properties:
            company_logo:
              type: string
              enum:
