  "/api/v1/document_templates/documents":
    post:
      summary: Create Document from Template
      description: Creates and optionally sends a new document for signing. If `draft`
        is set to true the document will not be sent. Pre-signed template signatures
        and initials are copied to the new document as document content — they remain
        visible on the document but do not generate a signing event, do not emit a
        `document_signed` webhook, and the recipient's status will not reflect them
        as a real signing action. If the template was pre-signed for a signer and
        the request adds new unsigned signature/initials fields for that same signer,
        the pre-applied ratifications are cleared silently so the signer is asked
        to sign once. Recipients are notified by email, SMS, or both based on each
        recipient's `delivery_method`. SMS delivery is available only to workspaces
        that are eligible for SMS and have it enabled, and requires a `phone_number`
        in E.164 format.
