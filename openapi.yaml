          - placeholder_id
          - type
    Files:
      type: array
      description: 'Document files can be uploaded by specifying a file URL or base64
        string. Either `file_url` or `file_base64` must be present (not both). Valid
        file types are: .pdf, .doc, .docx, .pages, .ppt, .pptx, .key, .xls, .xlsx,
        .numbers, .jpg, .jpeg, .png, .tiff, .tif, .webp, .html, and .htm'
      items:
        type: object
        properties:
          name:
            type: string
            description: Name of the file that will be uploaded.
          file_url:
            type: string
            format: url
            description: Publicly available URL of the file to be uploaded.
          file_base64:
            type: string
            format: byte
            description: A RFC 4648 base64 string of the file to be uploaded.
        required:
        - name
    Limit:
      type: integer
      minimum: 1
      maximum: 50
      default: 10
      description: The number of documents to fetch. Defaults to 10, max is 50.
    Page:
      type: integer
      minimum: 1
      default: 1
      description: The page number for pagination. Defaults to the first page.
    Placeholders:
      type: array
      description: Placeholders are generally job roles that must complete and/or
        sign the document. For example, a placeholder might be “Client” or “Legal
        Department”. When a document is created from the template, you assign a person
        to each placeholder.
      items:
        type: object
        properties:
          id:
            type: string
            description: A unique identifier that you will give to each placeholder.
              We recommend numbering sequentially from 1 to X. IDs are required for
              associating recipients to fields and more.
          name:
            type: string
            description: Name of the placeholder.
          preassigned_recipient_name:
            type: string
            description: In some cases, it may be necessary to pre-fill the name and
              email for a placeholder because it will always be the same person for
              all documents created from this template. This sets the name. Every
              recipient on a 21 CFR Part 11 document needs a name, so leaving it unset
              means the name has to be supplied when the document is created.
          preassigned_recipient_email:
            type: string
            format: email
            description: In some cases, it may be necessary to pre-fill the name and
              email for a placeholder because it will always be the same person for
              all documents created from this template. This sets the email.
          passcode_delivery:
            type: object
            description: 'Passcode delivery (OTP) settings for this placeholder. When
              enabled, documents created from this template inherit these settings
              for the corresponding recipient. While 21 CFR Part 11 is enabled for
              the workspace, a placeholder cannot disable passcode delivery: it returns
              a 422.'
            properties:
              enabled:
                type: boolean
                description: 'Enable passcode delivery for this recipient. Cannot
                  be set to `false` on a 21 CFR Part 11 document: it returns a 422.'
              methods:
                type: array
                items:
                  type: string
                  enum:
                  - email
                description: 'Delivery methods for the passcode. Currently supports:
                  email. Defaults to ["email"] when omitted.'
              expire_after_access:
                type: boolean
                description: Whether the passcode expires after the recipient accesses
                  the document. Inherited by documents created from this template.
        required:
        - id
        - name
    ReminderRecipients:
      type: array
      description: 'Optional list of recipients within the document to remind. If
        none are specified, all recipients that have not signed yet are reminded.
        Each recipient is reminded through their own delivery method: email-only recipients
        get a reminder email, SMS-only recipients get a reminder text, and email_and_sms
        recipients get both. If the workspace has insufficient SMS credit, only the
        SMS reminder is skipped and the sender is notified once; the email reminder
        (if applicable) still goes out.'
      items:
        type: object
        properties:
          name:
            type: string
            description: Recipient's name (required if multiple recipients share the
              same email).
          email:
            type: string
            format: email
            description: Recipient's email address. Used to match the recipient to
              remind; not required for SMS-only recipients, who can be identified
              by name instead.
    update_recipients_map:
      type: array
      description: List of recipients to update on the document.
      items:
        type: object
        required:
        - id
        - name
        - email
        properties:
          id:
            type: string
            description: The recipient's unique identifier from the Get Document response.
          name:
            type: string
            description: Updated name for the recipient.
          email:
            type: string
            format: email
            example: jane@example.com
            description: Updated email address for the recipient.
          subject:
            type: string
            description: Updated email subject for the signature request that this
              recipient will see.
          message:
            type: string
            description: Updated email message for the signature request that this
              recipient will see.
          passcode:
            type: string
            description: Updated passcode for the recipient. If set, the signer will
              be required to enter the passcode before viewing and completing the
              document. On a 21 CFR Part 11 document SignWell generates the passcode,
              so a sender-defined passcode returns a 422.
          passcode_delivery:
            type: object
            description: Passcode delivery settings. Always on for 21 CFR Part 11
              documents and cannot be disabled.
            properties:
              enabled:
                type: boolean
                description: 'Enable or disable passcode delivery. Cannot be set to
                  `false` on a 21 CFR Part 11 document: it returns a 422.'
              methods:
                type: array
                items:
                  type: string
                  enum:
                  - email
                description: Delivery methods. Defaults to ["email"].
              expire_after_access:
                type: boolean
                description: Clear passcode after successful authentication. If passcode_delivery
                  is also enabled, a new passcode is auto-generated on the next send
                  request. Otherwise the recipient will no longer need a passcode.
    TemplateFieldValues:
      type: array
      description: Fields of your template(s) that you can prepopulate with values.
        Signature and Initials fields cannot be signed through the API.
      items:
        type: object
        properties:
          api_id:
            type: string
            description: The API ID of the field in your template. This field is case
              sensitive.
          value:
            oneOf:
            - type: string
            - type: boolean
            - type: number
            description: TextField value must be a string or a number.
        required:
        - api_id
        - value
    TemplateId:
      type: string
      format: uuid
      description: 'Unique identifier for a template. A template that carries a pre-applied
        signature or initials field cannot be used while 21 CFR Part 11 is enabled,
        which requires every signature to be signed by the recipient: it returns a
        422.'
    TemplateIds:
      type: array
      items:
        type: string
        format: uuid
      description: 'Unique identifiers for a list of templates. A template that carries
        a pre-applied signature or initials field cannot be used while 21 CFR Part
        11 is enabled, which requires every signature to be signed by the recipient:
        it returns a 422.'
    TemplateRecipients:
      type: array
      description: Document recipients are people that must complete and/or sign a
        document. Recipients of the document must be assigned to a placeholder of
        the template. Recipients will inherit all placeholder fields and settings.
      items:
        type: object
        properties:
          id:
            type: string
            description: A unique identifier that you will give to each recipient.
              We recommend numbering sequentially from 1 to X. IDs are required for
              associating recipients to fields and more.
          name:
            type: string
            description: 'Name of the recipient. Required on 21 CFR Part 11 documents:
              a recipient without a name returns a 422.'
          email:
            type: string
            format: email
            description: Email address for the recipient. Required unless `delivery_method`
              is `sms`.
            example: signer@example.com
          placeholder_name:
            type: string
            description: The name of the placeholder you want this recipient assigned
              to.
          passcode:
            type: string
            description: If set, signers assigned with a passcode will be required
              to enter the passcode before they’re able to view and complete the document.
              On a 21 CFR Part 11 document SignWell generates the passcode, so a sender-defined
              passcode returns a 422.
          passcode_delivery:
            type: object
            description: Passcode delivery settings. When enabled, the system delivers
              the passcode to the signer via email. Always on for 21 CFR Part 11 documents
              and cannot be disabled.
            properties:
              enabled:
                type: boolean
                description: 'Enable passcode delivery for this recipient. Cannot
                  be set to `false` on a 21 CFR Part 11 document: it returns a 422.'
              methods:
                type: array
                items:
                  type: string
                  enum:
                  - email
                description: 'Delivery methods for the passcode. Currently supports:
                  email. Defaults to ["email"] when omitted.'
              expire_after_access:
                type: boolean
                description: When enabled, the passcode is cleared after successful
                  authentication. If passcode_delivery is also enabled, a new passcode
                  is auto-generated on the next send request. Otherwise the recipient
                  will no longer need a passcode.
          subject:
            type: string
            description: Email subject for the signature request that the recipient
              will see. Overrides the general subject for the template.
          message:
            type: string
            description: Email message for the signature request that the recipient
              will see. Overrides the general message for the template.
          send_email:
            type: boolean
            default: false
            description: Applies on when `embedded_signing` is `true`. By default,
              recipients are not notified through email to sign when doing embedded
              signing. Setting this to `true`  will send a notification email to the
              recipient. Default is `false`.
          send_email_delay:
            type: integer
            default: 0
            description: If `send_email` is `true` recipients will receive a new document
              notification immediately. In the case of embedded signing, you can delay
              this notification to only send if the document is not completed within
              a few minutes. The email notification will not go out if the document
              is completed before the delay time is over. Valid values are in minutes
              ranging from `0` to `60`. Defaults to `0`.
          delivery_method:
            type: string
            enum:
            - email
            - sms
            - email_and_sms
            default: email
            description: 'How the recipient is notified and receives the signing link:
              `email` (default), `sms`, or `email_and_sms`. SMS delivery is available
              only to workspaces that are eligible for SMS and have it enabled. `email`
              requires `email`, `sms` requires `phone_number`, and `email_and_sms`
              requires both. SMS content always uses fixed system templates; `subject`
              and `message` apply to email notifications only. A 21 CFR Part 11 document
              records one verified channel per recipient: `email` and `sms` are both
              accepted, while `email_and_sms` returns a 422.'
          phone_number:
            type: string
            example: "+14155551234"
            description: Recipient phone number in E.164 format (for example `+14155551234`).
              Required when `delivery_method` is `sms` or `email_and_sms`. Only phone
              numbers from the country codes currently enabled for SMS are accepted.
          send_sms:
            type: boolean
            default: false
            description: Applies only when `embedded_signing` is `true` and the recipient's
              `delivery_method` includes SMS. By default, recipients are not notified
              through SMS when doing embedded signing. Setting this to `true` will
              send the SMS notification to the recipient. Default is `false`.
          send_sms_delay:
            type: integer
            default: 0
            description: If `send_sms` is `true` the recipient will receive the SMS
              notification immediately. In the case of embedded signing, you can delay
              this notification to only send if the document is not completed within
              a few minutes. The SMS will not go out if the document is completed
              before the delay time is over. Valid values are in minutes ranging from
              `0` to `60`. Defaults to `0`.
        required:
        - id
    UrlOnly:
      type: boolean
      default: false
      description: Whether to return the URL of the completed PDF or the actual PDF
        content. Defaults to `false`.
    ObjectOnly:
      type: boolean
      default: false
      description: If true, returns raw NOM-151 constancia certificate object as JSON
        instead of a zip file or URL.
    IncludeAuditPage:
      type: boolean
      default: true
      description: 'Whether to include the audit page as part of the document. Defaults
        to `true`. Cannot be turned off on a 21 CFR Part 11 document: the audit page
        is part of the record and setting it to `false` returns a 422.'
    FileFormat:
      type: string
      enum:
      - pdf
      - zip
      description: Format of the file to be downloaded. Supported formats are 'pdf'
        and 'zip'. `zip` is unavailable on a 21 CFR Part 11 document, whose completed
        PDF, E-Signature page and audit page stay together as one record.
    UserEmail:
      type: string
      format: email
      description: The email address of the user that sent the Bulk Send. Must have
        the `admin` or `manager` role to view Bulk Sends of other users. Defaults
        to the user that the API key belongs to.
    Labels:
      type: array
      description: Labels can be used to organize documents in a way that can make
        it easy to find using the document search in SignWell. A document can have
        multiple labels.
      items:
        "$ref": "#/components/schemas/LabelRequest"
    LabelsUpdate:
      type: array
      description: Labels can be used to organize documents in a way that can make
        it easy to find using the document search in SignWell. A document can have
        multiple labels. Updating labels on a document will replace any existing labels
        for that document.
      items:
        "$ref": "#/components/schemas/LabelRequest"
    LabelsResponse:
      type: array
      description: Labels can be used to organize documents in a way that can make
        it easy to find using the document search in SignWell. A document can have
        multiple labels. Updating labels on a document will replace any existing labels
        for that document.
      items:
        "$ref": "#/components/schemas/LabelResponse"
    LabelResponse:
      type: object
      description: Labels can be used to organize documents and templates in a way
        that can make it easy to find using the document search/template search in
        SignWell. Labels can be used to organize documents in a way that can make
        it easy to find using the document search in SignWell.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - name
    LabelRequest:
      type: object
      description: Labels can be used to organize documents and templates in a way
        that can make it easy to find using the document search/template search in
        SignWell. Labels can be used to organize documents in a way that can make
        it easy to find using the document search in SignWell.
      properties:
        name:
          type: string
      required:
      - name
    DropdownOption:
      oneOf:
      - type: string
        title: SimpleOption
        description: Simple string option
      - type: object
        title: DetailedOption
        description: Detailed option object
        properties:
          name:
            type: string
            description: Option display name
          api_id:
            type: string
            description: Unique identifier for the option
          is_other:
            type: boolean
            description: Whether this is the special "Other" option
            default: false
        required:
        - name
      description: A dropdown option - either a simple string or a detailed object
        with name and optional api_id
    CreateBulkSendRequest:
      type: object
      properties:
        template_ids:
          type: array
          items:
            type: string
            format: uuid
            example: 00000000-0000-0000-0000-000000000000
          description: 'Unique identifiers for a list of templates. A template that
            carries a pre-applied signature or initials field cannot be used while
            21 CFR Part 11 is enabled, which requires every signature to be signed
            by the recipient: it returns a 422.'
        bulk_send_csv:
          type: string
          description: 'A RFC 4648 base64 string of the template CSV file to be validated.
            While 21 CFR Part 11 is enabled, every recipient needs a name: the CSV
            must carry a name column next to each placeholder email column (for example
            `signer_name` alongside `signer_email`), and each row must fill that name
            in wherever it carries the matching email, otherwise it returns a 422.
            A row that leaves both the email and the name blank sends nothing to that
            placeholder, so no name is needed there.'
          example: bmFtZSxlbWFpbApUZXN0LHRlc3RAZXhhbXBsZS5jb20K
